<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>견자희 3D 모델</title>
    <style>
      :root {
        --sky: #8edcff;
        --gold: #f5c542;
        --navy: #071a2b;
        --text: #eaf6ff;
        --muted: #b6d6ea;
        --line: rgba(142, 220, 255, 0.28);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        color: var(--text);
        font-family: "SUIT", system-ui, sans-serif;
        background:
          radial-gradient(circle at 12% 8%, rgba(142, 220, 255, 0.22), transparent 30%),
          radial-gradient(circle at 88% 10%, rgba(255, 207, 83, 0.18), transparent 24%),
          linear-gradient(180deg, #04101b 0%, #081d31 45%, #0b2740 100%);
        overflow: hidden;
      }
      #stage { position: fixed; inset: 0; }
      header {
        position: fixed; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 14px 16px; pointer-events: none;
      }
      header > * { pointer-events: auto; }
      h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
      a { color: var(--sky); text-decoration: none; font-size: 14px; }
      .panel {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
        max-width: calc(100% - 32px);
        padding: 8px; border: 1px solid var(--line); border-radius: 18px;
        background: rgba(6, 24, 40, 0.82); backdrop-filter: blur(8px);
      }
      button {
        font: inherit; font-size: 13px; color: var(--text);
        padding: 8px 12px; border-radius: 12px; cursor: pointer;
        border: 1px solid var(--line); background: transparent;
      }
      button[aria-pressed="true"] { background: var(--gold); color: var(--navy); border-color: var(--gold); }
      #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <div id="status">모델 불러오는 중…</div>
    <header>
      <h1>견자희 3D 모델</h1>
      <a href="../index.html">← 팬사이트로</a>
    </header>
    <div class="panel" role="toolbar" aria-label="보기 설정">
      <button data-mode="texture" aria-pressed="true">텍스처</button>
      <button data-mode="clay" aria-pressed="false">형태만</button>
      <button id="spin" aria-pressed="true">자동 회전</button>
      <a id="download" href="gyeonjahee.glb" download><button tabindex="-1">GLB 받기</button></a>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const stage = document.getElementById("stage");
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      stage.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 20);
      camera.position.set(0, 0.95, 3.6);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.85, 0);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.6;
      controls.minDistance = 0.6;
      controls.maxDistance = 6;
      window.viewer = { camera, controls }; // 콘솔에서 시점 조정용

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(0.7, 64),
        new THREE.MeshBasicMaterial({ color: 0x8edcff, transparent: true, opacity: 0.08 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const status = document.getElementById("status");
      try {
        const gltf = await new GLTFLoader().loadAsync("gyeonjahee.glb");
        const meshes = [];
        gltf.scene.traverse((o) => o.isMesh && meshes.push(o));
        // 모드별 재질: 원래 재질(텍스처·꼭짓점 색) / 형태만
        const clay = new THREE.MeshStandardMaterial({ color: 0xe8d6cf, roughness: 0.6 });
        const original = new Map(meshes.map((m) => [m, m.material]));
        const modes = {
          texture: (m) => original.get(m),
          clay: () => clay,
        };
        scene.add(gltf.scene);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.2));
        const key = new THREE.DirectionalLight(0xffffff, 1.4);
        key.position.set(1.5, 2.5, 2);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0xffffff, 0.8);
        fill.position.set(-2, 1.5, -1.5);
        scene.add(fill);
        status.remove();

        document.querySelectorAll("[data-mode]").forEach((btn) =>
          btn.addEventListener("click", () => {
            meshes.forEach((m) => (m.material = modes[btn.dataset.mode](m)));
            document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b === btn));
          })
        );
      } catch (err) {
        status.textContent = "모델을 불러오지 못했어요: " + err.message;
      }

      const spin = document.getElementById("spin");
      spin.addEventListener("click", () => {
        controls.autoRotate = !controls.autoRotate;
        spin.setAttribute("aria-pressed", controls.autoRotate);
      });

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
    </script>
  </body>
